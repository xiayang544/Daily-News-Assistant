<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日 AI 新闻助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root { --accent: #2563eb; --border: #e5e7eb; --bg: #f8fafc; --text: #1e293b; --muted: #64748b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); background: var(--bg); }
  .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; }
  header h1 { font-size: 22px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 20px; }
  .card h2 { font-size: 15px; margin: 0 0 14px; color: var(--muted); font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-family: inherit; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .btn { display: inline-block; padding: 8px 16px; border: none; border-radius: 6px; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .btn.danger { background: #fee2e2; color: #dc2626; }
  .user-item { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .user-item.active { border-color: var(--accent); background: #eff6ff; }
  .user-item .name { font-weight: 600; font-size: 14px; }
  .user-item .prefs { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .briefing-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .briefing-content { border-top: 1px solid var(--border); padding-top: 12px; line-height: 1.7; overflow-wrap: break-word; }
  .briefing-content h1 { font-size: 18px; } .briefing-content h2 { font-size: 16px; margin-top: 18px; }
  .briefing-content a { color: var(--accent); }
  .briefing-content blockquote { margin: 4px 0; padding: 2px 10px; border-left: 3px solid var(--border); color: var(--muted); font-size: 13px; }
  #status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📰 每日 AI 新闻助手</h1>
    <span>Agent 自主搜索 · 按订阅偏好筛选 · 定时推送</span>
  </header>

  <div class="grid">
    <div>
      <div class="card">
        <h2>我的订阅</h2>
        <form id="user-form">
          <input type="hidden" id="f-id">
          <label>身份 / 昵称 *</label>
          <input id="f-name" required placeholder="你是谁，如：小夏">
          <label>关注话题（逗号分隔）</label>
          <input id="f-topics" placeholder="LLM, 智能体, 开源模型">
          <label>关键词（逗号分隔）</label>
          <input id="f-keywords" placeholder="DeepSeek, Claude, 降本">
          <label>专属推送 Webhook（可选）</label>
          <input id="f-webhook" placeholder="留空则用全局配置">
          <div style="margin-top: 14px; display: flex; gap: 8px;">
            <button type="submit" class="btn" id="f-submit">保存订阅</button>
            <button type="button" class="btn ghost" id="f-cancel" style="display:none">取消编辑</button>
          </div>
        </form>
        <div id="status"></div>
      </div>

      <div class="card">
        <h2>订阅用户</h2>
        <div id="user-list"><div class="empty">还没有用户，先在上方创建</div></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>简报 <button class="btn" id="generate" style="float:right" disabled>立即生成</button></h2>
        <div id="briefing-list"><div class="empty">选中左侧用户后可查看历史简报</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let users = [], currentUser = null;

const setStatus = (msg, ok) => { $('status').textContent = msg; $('status').style.color = ok === false ? '#dc2626' : 'var(--muted)'; };

async function api(path, opts) {
  const resp = await fetch(path, opts);
  if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
  return resp.status === 204 ? null : resp.json();
}

async function loadUsers() {
  users = await api('/api/users');
  const box = $('user-list');
  if (!users.length) { box.innerHTML = '<div class="empty">还没有用户，先在上方创建</div>'; return; }
  box.innerHTML = '';
  for (const u of users) {
    const div = document.createElement('div');
    div.className = 'user-item' + (currentUser === u.id ? ' active' : '');
    div.innerHTML = `
      <div style="flex:1; cursor:pointer">
        <div class="name">${esc(u.name)}</div>
        <div class="prefs">${esc(u.topics || '全部 AI 动态')}</div>
      </div>
      <div>
        <button class="btn ghost" data-edit="${u.id}" style="padding:4px 10px; font-size:12px">编辑</button>
        <button class="btn danger" data-del="${u.id}" style="padding:4px 10px; font-size:12px">删除</button>
      </div>`;
    div.querySelector('[data-edit]').onclick = () => startEdit(u);
    div.querySelector('[data-del]').onclick = async () => {
      if (!confirm(`删除用户「${u.name}」及其所有简报？`)) return;
      await api(`/api/users/${u.id}`, { method: 'DELETE' });
      if (currentUser === u.id) { currentUser = null; $('briefing-list').innerHTML = '<div class="empty">选中左侧用户后可查看历史简报</div>'; }
      await loadUsers();
    };
    div.querySelector('.name').parentElement.onclick = e => { if (e.target.dataset.edit || e.target.dataset.del) return; selectUser(u.id); };
    box.appendChild(div);
  }
}

function selectUser(id) {
  currentUser = id;
  $('generate').disabled = false;
  loadUsers(); loadBriefings();
}

function startEdit(u) {
  $('f-id').value = u.id; $('f-name').value = u.name;
  $('f-topics').value = u.topics; $('f-keywords').value = u.keywords; $('f-webhook').value = u.webhook_url || '';
  $('f-submit').textContent = '更新订阅'; $('f-cancel').style.display = '';
}

$('f-cancel').onclick = () => {
  $('user-form').reset(); $('f-id').value = '';
  $('f-submit').textContent = '保存订阅'; $('f-cancel').style.display = 'none';
};

$('user-form').onsubmit = async e => {
  e.preventDefault();
  const body = {
    name: $('f-name').value.trim(),
    topics: $('f-topics').value.trim(),
    keywords: $('f-keywords').value.trim(),
    webhook_url: $('f-webhook').value.trim() || null,
  };
  if (!body.name) return;
  try {
    const id = $('f-id').value;
    await api(id ? `/api/users/${id}` : '/api/users', {
      method: id ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    setStatus(id ? '已更新' : '已创建');
    $('f-cancel').onclick();
    await loadUsers();
  } catch (err) { setStatus(err.message, false); }
};

async function loadBriefings() {
  if (!currentUser) return;
  const list = await api(`/api/briefings?user_id=${currentUser}`);
  const box = $('briefing-list');
  if (!list.length) { box.innerHTML = '<div class="empty">还没有简报，点右上角「立即生成」试试</div>'; return; }
  box.innerHTML = '';
  for (const b of list) {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="briefing-meta">#${b.id} · ${b.created_at}</div>
      <div class="briefing-content">${marked.parse(b.content)}</div>`;
    box.appendChild(div);
  }
}

$('generate').onclick = async () => {
  if (!currentUser) return;
  const btn = $('generate');
  btn.disabled = true; btn.textContent = 'Agent 生成中（约 1-3 分钟）…';
  setStatus('Agent 正在联网搜索并撰写简报，请稍候…');
  try {
    await api('/api/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: currentUser }),
    });
    setStatus('简报已生成 ✓');
    await loadBriefings();
  } catch (err) { setStatus(err.message, false); }
  btn.disabled = false; btn.textContent = '立即生成';
};

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

loadUsers();
</script>
</body>
</html>
