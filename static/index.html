<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日 AI 新闻助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root {
    --sidebar-bg: #0f172a; --sidebar-text: #94a3b8; --sidebar-active: #1e293b;
    --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef2ff;
    --bg: #f1f5f9; --card: #ffffff; --border: #e2e8f0;
    --text: #0f172a; --muted: #64748b; --success: #059669; --danger: #dc2626;
    --radius: 12px; --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 4px 16px rgba(15, 23, 42, .06);
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text); background: var(--bg); min-height: 100vh;
    display: flex;
  }

  /* ===== 左侧侧栏 ===== */
  aside {
    width: 320px; flex-shrink: 0; background: var(--sidebar-bg); color: var(--sidebar-text);
    display: flex; flex-direction: column; min-height: 100vh; position: sticky; top: 0;
    height: 100vh; overflow-y: auto;
  }
  .brand { padding: 24px 22px 18px; border-bottom: 1px solid #1e293b; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px; background: linear-gradient(135deg, #6366f1, #8b5cf6); margin-right: 12px;
    box-shadow: 0 4px 12px rgba(99, 102, 241, .4);
  }
  .brand h1 { font-size: 17px; color: #f1f5f9; display: inline; vertical-align: middle; font-weight: 700; }
  .brand p { font-size: 12px; margin-top: 10px; line-height: 1.6; }
  .panel-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .12em; padding: 18px 22px 10px; color: #475569;
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel-title button { font-size: 12px; letter-spacing: 0; text-transform: none; }
  .user-list { padding: 0 14px 20px; flex: 1; }
  .user-item {
    padding: 12px 14px; border-radius: 10px; margin-bottom: 6px; cursor: pointer;
    transition: background .15s; border: 1px solid transparent;
  }
  .user-item:hover { background: #1e293b66; }
  .user-item.active { background: var(--sidebar-active); border-color: #334155; }
  .user-item .name { color: #e2e8f0; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .user-item .name .avatar {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #6366f1, #a855f7);
  }
  .user-item .prefs { font-size: 12px; margin-top: 5px; line-height: 1.5; color: var(--sidebar-text);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .user-item .actions { margin-top: 8px; display: flex; gap: 6px; opacity: 0; transition: opacity .15s; }
  .user-item:hover .actions, .user-item.active .actions { opacity: 1; }
  .sidebar-footer { padding: 14px 22px 20px; border-top: 1px solid #1e293b; font-size: 12px; line-height: 1.8; }

  /* ===== 通用控件 ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500;
    background: var(--accent); color: #fff; transition: background .15s, transform .05s; font-family: inherit;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.small { padding: 4px 12px; font-size: 12px; border-radius: 6px; }
  .btn.ghost { background: transparent; color: #a5b4fc; }
  .btn.ghost:hover { background: #1e293b; }
  .btn.outline { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .btn.outline:hover { background: var(--accent-soft); }
  .btn.danger-text { background: transparent; color: #f87171; }
  .btn.danger-text:hover { background: #7f1d1d55; }

  /* ===== 用户表单（浮层弹窗）===== */
  dialog {
    border: none; border-radius: var(--radius); box-shadow: 0 20px 60px rgba(15, 23, 42, .25);
    padding: 26px; width: min(440px, calc(100vw - 40px));
  }
  dialog::backdrop { background: rgba(15, 23, 42, .5); backdrop-filter: blur(2px); }
  dialog h2 { font-size: 17px; margin-bottom: 4px; }
  dialog .sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin: 14px 0 5px; }
  label span { font-weight: 400; color: var(--muted); }
  input, select {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #fff; color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px #4f46e522; }
  dialog .footer { display: flex; gap: 10px; margin-top: 22px; }
  dialog .footer .btn { flex: 1; }

  /* ===== 右侧主区 ===== */
  main { flex: 1; min-width: 0; padding: 28px 32px 60px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .topbar h2 { font-size: 20px; }
  .topbar .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .generate-btn { position: relative; }
  .generate-btn .spin {
    width: 14px; height: 14px; border: 2px solid #ffffff55; border-top-color: #fff; border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .briefing { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 22px; overflow: hidden; }
  .briefing-head {
    display: flex; align-items: center; gap: 10px; padding: 14px 22px;
    border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #fafbfc, #f8fafc);
    font-size: 13px; color: var(--muted); flex-wrap: wrap;
  }
  .briefing-head .badge {
    background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 11px;
    padding: 2px 10px; border-radius: 20px;
  }
  .briefing-head .spacer { flex: 1; }
  .briefing-head a { color: var(--accent); text-decoration: none; font-size: 12px; }
  .briefing-body { padding: 8px 26px 24px; }

  /* markdown 排版 */
  .md { line-height: 1.85; font-size: 15px; color: #1e293b; }
  .md h1 { font-size: 21px; margin: 18px 0 4px; padding-bottom: 12px; border-bottom: 2px solid var(--accent-soft); }
  .md > blockquote {
    margin: 8px 0 4px; padding: 4px 14px; border-left: 3px solid var(--accent);
    background: var(--accent-soft); border-radius: 0 8px 8px 0; color: var(--muted); font-size: 13px;
  }
  .md h2 { font-size: 16.5px; margin: 26px 0 6px; display: flex; align-items: center; gap: 8px; }
  .md h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
  .md p { margin: 8px 0; }
  .md a { color: var(--accent); text-decoration: none; border-bottom: 1px solid #4f46e544; }
  .md a:hover { border-bottom-color: var(--accent); }
  .md ul, .md ol { padding-left: 24px; margin: 8px 0; }
  .md code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  /* 空状态 */
  .empty {
    text-align: center; padding: 70px 20px; color: var(--muted); background: var(--card);
    border: 1px dashed var(--border); border-radius: var(--radius);
  }
  .empty .icon { font-size: 42px; margin-bottom: 14px; }
  .empty h3 { color: var(--text); font-size: 16px; margin-bottom: 6px; }
  .empty p { font-size: 13px; line-height: 1.7; }

  /* Toast */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #0f172a; color: #fff; padding: 11px 22px; border-radius: 10px; font-size: 14px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, .35); opacity: 0; transition: all .3s; z-index: 99;
    display: flex; align-items: center; gap: 8px; max-width: 90vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: #7f1d1d; }

  @media (max-width: 860px) {
    body { flex-direction: column; }
    aside { width: 100%; height: auto; position: static; min-height: 0; }
    .user-list { max-height: 300px; }
    main { padding: 20px 16px 40px; }
  }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <span class="logo">📰</span><h1>AI 新闻助手</h1>
    <p>Agent 自主联网搜索 · 按你的订阅偏好筛选 · 每天定时生成推送</p>
  </div>

  <div class="panel-title">
    订阅用户
    <button class="btn small ghost" id="btn-new">＋ 新增</button>
  </div>
  <div class="user-list" id="user-list"></div>

  <div class="sidebar-footer">
    💡 点「立即生成」可随时手动触发一次 Agent 简报<br>
    ⏰ 定时任务随服务进程运行，每天自动执行
  </div>
</aside>

<main>
  <div class="topbar">
    <div>
      <h2 id="main-title">简报</h2>
      <div class="sub" id="main-sub">从左侧选择一位用户开始</div>
    </div>
    <button class="btn generate-btn" id="generate" disabled>⚡ 立即生成</button>
  </div>
  <div id="briefing-list"></div>
</main>

<dialog id="user-dialog">
  <h2 id="dlg-title">新增订阅</h2>
  <div class="sub">设置身份与偏好，Agent 会据此为你筛选新闻</div>
  <form id="user-form" method="dialog">
    <input type="hidden" id="f-id">
    <label>身份 / 昵称 <span>*</span></label>
    <input id="f-name" required maxlength="50" placeholder="如：小夏">
    <label>关注话题 <span>（逗号分隔）</span></label>
    <input id="f-topics" placeholder="LLM, 智能体, 开源模型">
    <label>关键词 <span>（逗号分隔，进一步过滤）</span></label>
    <input id="f-keywords" placeholder="DeepSeek, Claude, 降本">
    <label>专属推送 Webhook <span>（可选，留空用全局配置）</span></label>
    <input id="f-webhook" placeholder="https://oapi.dingtalk.com/robot/send?access_token=…">
    <label>Webhook 渠道 <span>（专属 webhook 对应的机器人类型）</span></label>
    <select id="f-channel">
      <option value="">跟随全局配置</option>
      <option value="dingtalk">钉钉</option>
      <option value="feishu">飞书</option>
      <option value="wecom">企业微信</option>
    </select>
    <div class="footer">
      <button type="button" class="btn outline" id="dlg-cancel">取消</button>
      <button type="submit" class="btn">保存</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let users = [], currentUser = null, toastTimer = null;

function toast(msg, ok = true) {
  const t = $('toast');
  t.textContent = (ok ? '✓ ' : '✕ ') + msg;
  t.className = ok ? 'show' : 'show error';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 3000);
}

async function api(path, opts) {
  const resp = await fetch(path, opts);
  if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || `HTTP ${resp.status}`);
  return resp.status === 204 ? null : resp.json();
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function avatarColor(name) {
  const colors = [['#6366f1','#a855f7'], ['#0ea5e9','#6366f1'], ['#f59e0b','#ef4444'], ['#10b981','#0ea5e9'], ['#ec4899','#8b5cf6']];
  const c = colors[(name.charCodeAt(0) || 0) % colors.length];
  return `linear-gradient(135deg, ${c[0]}, ${c[1]})`;
}

/* ---------- 用户 ---------- */
async function loadUsers() {
  users = await api('/api/users');
  const box = $('user-list');
  if (!users.length) {
    box.innerHTML = `<div style="padding:18px 10px;font-size:13px;line-height:1.8;color:var(--sidebar-text)">
      还没有订阅用户<br>点上方「＋ 新增」创建第一个</div>`;
    return;
  }
  box.innerHTML = '';
  for (const u of users) {
    const div = document.createElement('div');
    div.className = 'user-item' + (currentUser === u.id ? ' active' : '');
    div.innerHTML = `
      <div class="name"><span class="avatar" style="background:${avatarColor(u.name)}">${esc(u.name[0] || '?')}</span>${esc(u.name)}</div>
      <div class="prefs">${esc(u.topics || '全部 AI 动态')}</div>
      <div class="actions">
        <button class="btn small ghost" data-edit>编辑</button>
        <button class="btn small danger-text" data-del>删除</button>
      </div>`;
    div.onclick = e => {
      if (e.target.dataset.edit !== undefined || e.target.dataset.del !== undefined) return;
      selectUser(u.id);
    };
    div.querySelector('[data-edit]').onclick = () => openDialog(u);
    div.querySelector('[data-del]').onclick = async () => {
      if (!confirm(`删除用户「${u.name}」及其所有简报？`)) return;
      try {
        await api(`/api/users/${u.id}`, { method: 'DELETE' });
        toast(`已删除 ${u.name}`);
        if (currentUser === u.id) { currentUser = null; renderBriefings([], null); $('generate').disabled = true;
          $('main-title').textContent = '简报'; $('main-sub').textContent = '从左侧选择一位用户开始'; }
        await loadUsers();
      } catch (err) { toast(err.message, false); }
    };
    box.appendChild(div);
  }
}

function selectUser(id) {
  currentUser = id;
  const u = users.find(x => x.id === id);
  $('main-title').textContent = `${u.name} 的简报`;
  $('main-sub').textContent = u.topics ? `订阅：${u.topics}` : '订阅：全部 AI 动态';
  $('generate').disabled = false;
  loadUsers(); loadBriefings();
}

/* ---------- 弹窗表单 ---------- */
function openDialog(u = null) {
  $('dlg-title').textContent = u ? '编辑订阅' : '新增订阅';
  $('f-id').value = u ? u.id : '';
  $('f-name').value = u ? u.name : '';
  $('f-topics').value = u ? u.topics : '';
  $('f-keywords').value = u ? u.keywords : '';
  $('f-webhook').value = u ? (u.webhook_url || '') : '';
  $('f-channel').value = u ? (u.push_channel || '') : '';
  $('user-dialog').showModal();
}
$('btn-new').onclick = () => openDialog();
$('dlg-cancel').onclick = () => $('user-dialog').close();
$('user-dialog').addEventListener('click', e => { if (e.target === $('user-dialog')) $('user-dialog').close(); });

$('user-form').onsubmit = async e => {
  e.preventDefault();
  const body = {
    name: $('f-name').value.trim(),
    topics: $('f-topics').value.trim(),
    keywords: $('f-keywords').value.trim(),
    webhook_url: $('f-webhook').value.trim() || null,
    push_channel: $('f-channel').value || null,
  };
  if (!body.name) return;
  try {
    const id = $('f-id').value;
    await api(id ? `/api/users/${id}` : '/api/users', {
      method: id ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    toast(id ? '订阅已更新' : `已创建 ${body.name}`);
    $('user-dialog').close();
    await loadUsers();
    if (!currentUser && users.length) selectUser(users[users.length - 1].id);
  } catch (err) { toast(err.message, false); }
};

/* ---------- 简报 ---------- */
async function loadBriefings() {
  if (!currentUser) return;
  let list;
  try { list = await api(`/api/briefings?user_id=${currentUser}`); }
  catch (err) { toast(err.message, false); return; }
  renderBriefings(list, users.find(u => u.id === currentUser));
}

function renderBriefings(list, user) {
  const box = $('briefing-list');
  if (!list || !list.length) {
    box.innerHTML = `<div class="empty">
      <div class="icon">🗞️</div>
      <h3>还没有简报</h3>
      <p>点右上角「⚡ 立即生成」<br>Agent 会联网搜索并为你撰写今日 AI 日报（约 1-3 分钟）</p>
    </div>`;
    return;
  }
  box.innerHTML = '';
  for (const b of list) {
    const div = document.createElement('div');
    div.className = 'briefing';
    div.innerHTML = `
      <div class="briefing-head">
        <span class="badge">#${b.id}</span>
        <span>${esc(b.created_at)}</span>
        <span class="spacer"></span>
        ${b.file_path ? `<a href="javascript:void(0)" data-copy="${esc(b.file_path)}">复制文件路径</a>` : ''}
      </div>
      <div class="briefing-body"><div class="md">${marked.parse(b.content)}</div></div>`;
    const copyLink = div.querySelector('[data-copy]');
    if (copyLink) copyLink.onclick = () => {
      navigator.clipboard.writeText(copyLink.dataset.copy).then(() => toast('文件路径已复制'));
    };
    box.appendChild(div);
  }
}

/* ---------- 生成 ---------- */
$('generate').onclick = async () => {
  if (!currentUser) return;
  const btn = $('generate');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Agent 生成中…';
  toast('Agent 正在联网搜索并撰写简报，约需 1-3 分钟');
  try {
    const b = await api('/api/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: currentUser }),
    });
    toast(`简报 #${b.id} 已生成`);
    await loadBriefings();
  } catch (err) { toast(err.message, false); }
  btn.disabled = false;
  btn.textContent = '⚡ 立即生成';
};

loadUsers().then(() => { if (!currentUser && users.length) selectUser(users[0].id); });
</script>
</body>
</html>
